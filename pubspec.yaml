name: mangroveguardapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  tflite_flutter: ^0.12.1
  image: ^4.2.0
  camera: ^0.11.3
  image_picker: ^1.0.7
  permission_handler: ^11.3.1

  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  smooth_page_indicator: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/MangroveGuardLogo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#021B1A"
  adaptive_icon_foreground: "images/MangroveGuardLogo.png"

flutter_native_splash:
  color: "#021B1A"
  image: images/MangroveGuardLogo_splash.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#021B1A"
    image: images/MangroveGuardLogo_splash.png
